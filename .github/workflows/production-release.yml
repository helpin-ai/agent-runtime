name: Production Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-production-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/helpin-ai/agent-runtime
  CONSOLE_IMAGE: ghcr.io/helpin-ai/agent-runtime-console

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  # Automatic CLI checks are paused until CLI release work resumes.
  # cli:
  #   if: github.ref == 'refs/heads/main'
  #   uses: ./.github/workflows/cli.yml

  version:
    if: github.ref == 'refs/heads/main'
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine stable version
        id: version
        run: |
          # Latest stable tag (excludes -rc./-dev.).
          LATEST_STABLE=$(git tag -l 'v*' --sort=-v:refname | grep -vE '\-(rc|dev)\.' | head -n1 || echo "v0.0.0")
          if [ "$LATEST_STABLE" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" -20)
          else
            COMMITS=$(git log "$LATEST_STABLE"..HEAD --pretty=format:"%s")
          fi

          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qiE "^(BREAKING CHANGE|breaking|major):"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^(feat|feature|minor):"; then
            BUMP_TYPE="minor"
          fi

          VERSION=${LATEST_STABLE#v}
          IFS='.' read -ra PARTS <<< "$VERSION"
          MAJOR=${PARTS[0]:-0}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          # Skip versions already tagged (e.g. re-runs) by bumping patch.
          while git rev-parse "v${MAJOR}.${MINOR}.${PATCH}" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
          done

          VERSION_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION_TAG"

  build:
    permissions:
      contents: read
      packages: write
    needs:
      - version
      - checks
      # - cli # Restore alongside the CLI job and workflow_call trigger.
    uses: ./.github/workflows/release-images.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: prod

  release:
    permissions:
      contents: write
    name: Tag and Update Production Manifests
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          git tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Checkout gitops manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helpin-ai/gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Update production image tag
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cd gitops/agent-runtime/prod
          kustomize edit set image \
            "${{ env.IMAGE }}=${{ env.IMAGE }}:${VERSION}" \
            "${{ env.IMAGE }}-coding=${{ env.IMAGE }}-coding:${VERSION}" \
            "${{ env.CONSOLE_IMAGE }}=${{ env.CONSOLE_IMAGE }}:${VERSION}"
          cd "$GITHUB_WORKSPACE"
          bash scripts/push-gitops.sh gitops \
            "chore: update agent-runtime prod image to ${VERSION}" agent-runtime/prod

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --target main || echo "Release creation skipped"

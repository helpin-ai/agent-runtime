name: Staging Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "k8s/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: agent-runtime-staging-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/helpin-ai/agent-runtime
  CONSOLE_IMAGE: ghcr.io/helpin-ai/agent-runtime-console

jobs:
  version:
    name: Determine RC Version
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.version.outputs.rc_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine RC version
        id: version
        run: |
          LATEST_STABLE=$(git tag -l 'v*' --sort=-v:refname | grep -vE '\-(rc|dev)\.' | head -n1 || echo "v0.0.0")
          if [ "$LATEST_STABLE" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" -20)
          else
            COMMITS=$(git log "$LATEST_STABLE"..HEAD --pretty=format:"%s")
          fi

          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qiE "^(BREAKING CHANGE|breaking|major):"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^(feat|feature|minor):"; then
            BUMP_TYPE="minor"
          fi

          VERSION=${LATEST_STABLE#v}
          IFS='.' read -ra PARTS <<< "$VERSION"
          MAJOR=${PARTS[0]:-0}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          BASE_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          LATEST_RC=$(git tag -l "${BASE_VERSION}-rc.*" --sort=-v:refname | head -n1 || echo "")
          if [ -n "$LATEST_RC" ]; then
            RC_NUM=$(echo "$LATEST_RC" | sed "s/${BASE_VERSION}-rc\.//")
            RC_NUM=$((RC_NUM + 1))
          else
            RC_NUM=1
          fi

          RC_TAG="${BASE_VERSION}-rc.${RC_NUM}"
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "RC tag: $RC_TAG"

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        run: |
          docker buildx build \
            -t ${{ env.IMAGE }}:${{ needs.version.outputs.rc_tag }} \
            -t ${{ env.IMAGE }}:sha-${{ github.sha }} \
            -t ${{ env.IMAGE }}:stage-latest \
            --push \
            .

      - name: Build and push console image
        run: |
          docker buildx build \
            -f packages/console/Dockerfile \
            -t ${{ env.CONSOLE_IMAGE }}:${{ needs.version.outputs.rc_tag }} \
            -t ${{ env.CONSOLE_IMAGE }}:sha-${{ github.sha }} \
            -t ${{ env.CONSOLE_IMAGE }}:stage-latest \
            --push \
            .

  release:
    name: Tag and Update Staging Manifests
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push RC tag
        run: |
          RC_TAG="${{ needs.version.outputs.rc_tag }}"
          if git rev-parse "$RC_TAG" >/dev/null 2>&1; then
            git tag -d "$RC_TAG" || true
            git push origin ":refs/tags/$RC_TAG" || true
          fi
          git tag -a "$RC_TAG" -m "Release Candidate $RC_TAG"
          git push origin "$RC_TAG"

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update staging image tag
        run: |
          git pull --rebase origin develop
          RC_TAG="${{ needs.version.outputs.rc_tag }}"
          cd k8s/stage
          kustomize edit set image \
            "${{ env.IMAGE }}=${{ env.IMAGE }}:${RC_TAG}" \
            "${{ env.CONSOLE_IMAGE }}=${{ env.CONSOLE_IMAGE }}:${RC_TAG}"
          cd ../..
          git add k8s/stage/kustomization.yaml
          git commit -m "chore: update agent-runtime stage image to ${RC_TAG} [skip ci]" || echo "No manifest changes"
          git push origin develop

name: Staging Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-staging-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/helpin-ai/agent-runtime
  CONSOLE_IMAGE: ghcr.io/helpin-ai/agent-runtime-console

jobs:
  checks:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/ci.yml

  # Automatic CLI checks are paused until CLI release work resumes.
  # cli:
  #   if: github.ref == 'refs/heads/develop'
  #   uses: ./.github/workflows/cli.yml

  version:
    if: github.ref == 'refs/heads/develop'
    name: Determine RC Version
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.version.outputs.rc_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine RC version
        id: version
        run: |
          LATEST_STABLE=$(git tag -l 'v*' --sort=-v:refname | grep -vE '\-(rc|dev)\.' | head -n1 || echo "v0.0.0")
          if [ "$LATEST_STABLE" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" -20)
          else
            COMMITS=$(git log "$LATEST_STABLE"..HEAD --pretty=format:"%s")
          fi

          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qiE "^(BREAKING CHANGE|breaking|major):"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^(feat|feature|minor):"; then
            BUMP_TYPE="minor"
          fi

          VERSION=${LATEST_STABLE#v}
          IFS='.' read -ra PARTS <<< "$VERSION"
          MAJOR=${PARTS[0]:-0}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          BASE_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          LATEST_RC=$(git tag -l "${BASE_VERSION}-rc.*" --sort=-v:refname | head -n1 || echo "")
          if [ -n "$LATEST_RC" ]; then
            RC_NUM=${LATEST_RC#"$BASE_VERSION-rc."}
            RC_NUM=$((RC_NUM + 1))
          else
            RC_NUM=1
          fi

          RC_TAG="${BASE_VERSION}-rc.${RC_NUM}"
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "RC tag: $RC_TAG"

  build:
    permissions:
      contents: read
      packages: write
    needs:
      - version
      - checks
      # - cli # Restore alongside the CLI job and workflow_call trigger.
    uses: ./.github/workflows/release-images.yml
    with:
      version: ${{ needs.version.outputs.rc_tag }}
      channel: stage

  release:
    permissions:
      contents: write
    name: Tag and Update Staging Manifests
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push RC tag
        run: |
          RC_TAG="${{ needs.version.outputs.rc_tag }}"
          git tag -a "$RC_TAG" "$GITHUB_SHA" -m "Release Candidate $RC_TAG"
          git push origin "$RC_TAG"

      - name: Checkout gitops manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helpin-ai/gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Update staging image tag
        run: |
          RC_TAG="${{ needs.version.outputs.rc_tag }}"
          cd gitops/agent-runtime/stage
          kustomize edit set image \
            "${{ env.IMAGE }}=${{ env.IMAGE }}:${RC_TAG}" \
            "${{ env.IMAGE }}-coding=${{ env.IMAGE }}-coding:${RC_TAG}" \
            "${{ env.CONSOLE_IMAGE }}=${{ env.CONSOLE_IMAGE }}:${RC_TAG}"
          cd "$GITHUB_WORKSPACE"
          bash scripts/push-gitops.sh gitops \
            "chore: update agent-runtime stage image to ${RC_TAG}" agent-runtime/stage

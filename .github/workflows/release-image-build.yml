name: Build Release Candidate Image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      file:
        default: Dockerfile
        type: string
      target:
        required: true
        type: string
      cache-scope:
        required: true
        type: string
      fallback-cache-scope:
        required: true
        type: string
    outputs:
      digest:
        description: Immutable candidate digest to smoke-test and promote
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push directly to GHCR. Loading a tarball into Docker duplicates the
      # large coding image beside BuildKit's cache and exhausts runner storage.
      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: true
          load: false
          tags: ${{ inputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: |
            type=gha,scope=${{ inputs.cache-scope }}
            type=gha,scope=${{ inputs.fallback-cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
      - name: Disk usage
        if: always()
        run: |
          df -h /
          docker system df

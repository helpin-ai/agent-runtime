name: Windows runtime

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select Windows validation
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      windows: ${{ steps.select.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci_validation.py plan windows

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Native locks, ACLs and Windows paths
        run: go test ./internal/filelock ./internal/privatefile ./internal/sqliteuri ./sandbox/wsl -timeout 2m
      - name: Native workspace ownership
        run: go test ./internal/workspace -run '^TestAcquireRunLock' -timeout 2m
      - name: Native memory worker restart and ownership
        run: go test ./internal/memoryjobs -run '^TestJobsRestartRecoveryAndSingleOwner$' -timeout 2m
      - name: Native memory checkpoint restore
        run: go test ./memory -run '^TestSQLiteSnapshotRestoresWithoutWAL$' -timeout 2m
      - name: Native SQLite migrations, persistence and restart
        run: go test ./internal/store -run '^Test(SQLModelCredentialRestartCASAndTerminalCleanup|AutoMigrateAddsSkillsToExistingSQLiteMCPServerRows|SQLCreateRunWithMCPIsAtomicAndRoundTripsEncryptedPayload)$' -timeout 3m
      - name: Native browser and process cleanup contracts
        run: go test ./browser ./internal/tools -run '^Test(RunCLI|BrowserCLIHelper|BundledExtensionBrowserNativeLayout|WindowsCommandCancellationKillsDescendants)' -timeout 2m
      - name: Install pinned Chrome for Testing
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP chrome-win64.zip
          Invoke-WebRequest https://storage.googleapis.com/chrome-for-testing-public/149.0.7827.115/win64/chrome-win64.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1553389900824037aec828effab3051337df57a571e2f8800ee71cf8ed6fa76d') { throw 'Chrome checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP chrome-test
          Expand-Archive $archive $destination
          "AGENT_RUNTIME_BROWSER_EXTENSION_EXECUTABLE=$destination/chrome-win64/chrome.exe" >> $env:GITHUB_ENV
      - name: Exercise native extension, screenshots, takeover and restart
        env:
          AGENT_RUNTIME_EXTENSION_E2E: "1"
        run: go test ./internal/tools -run '^TestExtension(BrowserWithoutDevTools|InputAndFrames)$' -count=1 -timeout 5m

  validation:
    name: Windows validation
    needs: [plan, windows]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: record
        name: Require successful Windows checks and record validation
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci_validation.py record windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-windows-${{ steps.record.outputs.tree }}
          path: validation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

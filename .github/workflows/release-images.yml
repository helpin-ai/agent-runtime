name: Release Images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Find verified staging images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
      runtime_digest: ${{ steps.find.outputs.runtime_digest }}
      coding_digest: ${{ steps.find.outputs.coding_digest }}
      console_digest: ${{ steps.find.outputs.console_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: inputs.channel == 'prod'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Match successful staging build by source tree
        if: inputs.channel == 'prod'
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B scripts/release_image_record.py find

  runtime:
    name: Build runtime
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image-build.yml
    with:
      image: ghcr.io/helpin-ai/agent-runtime
      target: default
      cache-scope: runtime-support
      fallback-cache-scope: runtime-coding

  coding:
    name: Build coding
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image-build.yml
    with:
      image: ghcr.io/helpin-ai/agent-runtime-coding
      target: coding
      cache-scope: runtime-coding
      fallback-cache-scope: runtime-support

  console:
    name: Build console
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image-build.yml
    with:
      image: ghcr.io/helpin-ai/agent-runtime-console
      file: packages/console/Dockerfile
      target: runtime
      cache-scope: runtime-console
      fallback-cache-scope: runtime-console

  smoke:
    name: Smoke-test ${{ matrix.name }}
    needs: [runtime, coding, console]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            image: ghcr.io/helpin-ai/agent-runtime
            digest: ${{ needs.runtime.outputs.digest }}
            script: scripts/container-default-smoke.sh
          - name: coding
            image: ghcr.io/helpin-ai/agent-runtime-coding
            digest: ${{ needs.coding.outputs.digest }}
            script: scripts/container-toolchain-smoke.sh
          - name: console
            image: ghcr.io/helpin-ai/agent-runtime-console
            digest: ${{ needs.console.outputs.digest }}
            script: scripts/container-console-smoke.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A fresh runner pulls only one image: no BuildKit cache or export tarball
      # competes with Docker's unpacked layers for the build runner's disk.
      - name: Pull and test the candidate digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ matrix.digest }}
          SMOKE_SCRIPT: ${{ matrix.script }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          bash "$SMOKE_SCRIPT" "$IMAGE@$DIGEST"
      - name: Disk usage
        if: always()
        run: |
          df -h /
          docker system df

  promote:
    name: Publish tested image digests
    needs: [resolve, runtime, coding, console, smoke]
    if: >-
      always() && !cancelled() && needs.resolve.result == 'success' &&
      (needs.resolve.outputs.reuse == 'true' ||
      (needs.runtime.result == 'success' && needs.coding.result == 'success' &&
      needs.console.result == 'success' && needs.smoke.result == 'success'))
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No build, pull, or local retag: promote precisely what smoke tested.
      - name: Promote tested candidates
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          RUNTIME_DIGEST: ${{ needs.resolve.outputs.runtime_digest || needs.runtime.outputs.digest }}
          CODING_DIGEST: ${{ needs.resolve.outputs.coding_digest || needs.coding.outputs.digest }}
          CONSOLE_DIGEST: ${{ needs.resolve.outputs.console_digest || needs.console.outputs.digest }}
        run: |
          bash scripts/promote-release-images.sh \
            ghcr.io/helpin-ai/agent-runtime "$RUNTIME_DIGEST" \
            ghcr.io/helpin-ai/agent-runtime-coding "$CODING_DIGEST" \
            ghcr.io/helpin-ai/agent-runtime-console "$CONSOLE_DIGEST"
      - name: Record smoke-tested staging images
        if: inputs.channel == 'stage'
        env:
          RUNTIME_DIGEST: ${{ needs.runtime.outputs.digest }}
          CODING_DIGEST: ${{ needs.coding.outputs.digest }}
          CONSOLE_DIGEST: ${{ needs.console.outputs.digest }}
        run: python3 -B scripts/release_image_record.py record
      - name: Upload tested-image record
        if: inputs.channel == 'stage'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-release-images
          path: release-images.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

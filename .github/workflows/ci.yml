name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

  react:
    name: React Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run React tests
        working-directory: packages/react
        run: npm test

  console:
    name: Console Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/console/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: packages/console
        run: pnpm install --frozen-lockfile

      - name: Build console
        working-directory: packages/console
        run: pnpm run build

  manifests:
    name: Manifest Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Build staging manifests
        run: kubectl kustomize k8s/stage

      - name: Build production manifests
        run: kubectl kustomize k8s/prod

  images:
    name: Container Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t agent-runtime:ci .

      - name: Smoke-test runtime toolchain
        run: bash scripts/container-toolchain-smoke.sh agent-runtime:ci

      - name: Report runtime image size
        run: docker image inspect agent-runtime:ci --format 'agent-runtime:ci {{.Size}} bytes'

      - name: Build console image
        run: docker build -f packages/console/Dockerfile -t agent-runtime-console:ci .

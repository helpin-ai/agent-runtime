name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select required validation
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      go: ${{ steps.select.outputs.go }}
      react: ${{ steps.select.outputs.react }}
      console: ${{ steps.select.outputs.console }}
      manifests: ${{ steps.select.outputs.manifests }}
      cross: ${{ steps.select.outputs.cross }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci_validation.py plan ci

  go:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: runtime_test
          POSTGRES_DB: agent_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_RUNTIME_TEST_POSTGRES_DSN: postgres://postgres:runtime_test@localhost:5432/agent_runtime_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: sh scripts/go-mod-download.sh

      - name: Install workspace tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep python3-venv
          rg --version

      - name: Run Go tests
        run: go test ./...

  react:
    needs: plan
    if: needs.plan.outputs.react == 'true'
    name: React Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version

      - name: Run React tests
        working-directory: packages/react
        run: npm test

  console:
    needs: plan
    if: needs.plan.outputs.console == 'true'
    name: Console Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
          cache: true
          cache_dependency_path: packages/console/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: packages/console
        run: pnpm install --frozen-lockfile

      - name: Build console
        working-directory: packages/console
        run: pnpm run build

  manifests:
    needs: plan
    if: needs.plan.outputs.manifests == 'true'
    name: Manifest Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deployment manifests live in helpin-ai/gitops, which validates them.
      - name: Test release orchestration scripts
        run: |
          python3 -B scripts/test_release_images.py
          python3 -B scripts/test_ci_validation.py

  cross:
    name: Windows cross-builds on Linux
    needs: plan
    if: needs.plan.outputs.cross == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
      - run: sh scripts/go-mod-download.sh
      - name: Cross-build Windows x64 and ARM64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: |
          GOARCH=amd64 go build -o "$RUNNER_TEMP/agent-runtime-x64.exe" ./cmd/agent-runtime
          GOARCH=arm64 go build -o "$RUNNER_TEMP/agent-runtime-arm64.exe" ./cmd/agent-runtime

  validation:
    name: CI validation
    needs: [plan, go, react, console, manifests, cross]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: record
        name: Require successful checks and record validation
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci_validation.py record ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-ci-${{ steps.record.outputs.tree }}
          path: validation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

replicaCount: 1

image:
  repository: ghcr.io/example/agent-runtime
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090

env:
  AGENT_RUNTIME_ADDR: ":8090"
  AGENT_RUNTIME_STORE_DRIVER: postgres
  DATABASE_URL: ""
  TEMPORAL_ADDRESS: ""
  TEMPORAL_NAMESPACE: default
  AGENT_RUNTIME_APP_CONFIG: ""
  AGENT_RUNTIME_MCP_ALLOWED_HOSTS: ""
  AGENT_RUNTIME_MCP_ALLOW_PRIVATE_NETWORKS: "false"
  AGENT_RUNTIME_MCP_ALLOW_HTTP: "false"
  AGENT_RUNTIME_BROWSER_ENABLED: "false"
  AGENT_RUNTIME_BROWSER_SESSION_TIMEOUT_SECONDS: "300"
  AGENT_RUNTIME_BROWSER_COMMAND_TIMEOUT_SECONDS: "45"
  AGENT_RUNTIME_BROWSER_MAX_OUTPUT_CHARS: "8000"
  # Optional override; the default and coding images include /usr/bin/chromium.
  AGENT_RUNTIME_BROWSER_CHROMIUM_EXECUTABLE: ""
  # Hardened Kubernetes pods commonly block Chromium's process sandbox. Set
  # this to --no-sandbox,--disable-dev-shm-usage when the pod supplies the
  # non-root/seccomp isolation boundary.
  AGENT_RUNTIME_BROWSER_CHROMIUM_ARGS: ""
  # Private Python venv initialization. Duration or seconds.
  AGENT_RUNTIME_PYTHON_ENV_TIMEOUT: "5m"
  KERNEL_HEADLESS: "true"
  # Local development only. Shared environments must supply
  # secretEnv.AGENT_RUNTIME_SERVICE_TOKEN instead.
  AGENT_RUNTIME_ALLOW_ANONYMOUS: "false"

secretEnv:
  # Required unless AGENT_RUNTIME_ALLOW_ANONYMOUS=true. Set through your secret
  # manager/Helm values; do not use a shared placeholder token.
  AGENT_RUNTIME_SERVICE_TOKEN: ""
  # Required by the API and workers when apps attach credentials to runs.
  # Supply the same base64-encoded 32-byte key to both deployments.
  AGENT_RUNTIME_MCP_CREDENTIAL_ENCRYPTION_KEY: ""
  # Optional. Kernel is preferred when configured and enables browser_record;
  # otherwise browser tools use local Chromium. Keep the same value on API and
  # worker deployments when set.
  KERNEL_API_KEY: ""

worker:
  enabled: false
  replicaCount: 1
  # Keep this above AGENT_RUNTIME_WORKER_STOP_TIMEOUT (default 120 seconds).
  terminationGracePeriodSeconds: 150
  resources: {}

# Opt in only for trusted coding workloads on a dedicated worker. A single
# poller and retained volume keep subsequent turns on the same workspace.
codingWorker:
  enabled: false
  image:
    repository: ghcr.io/example/agent-runtime-coding
    tag: latest
    pullPolicy: IfNotPresent
  # Replicas above 1 need an RWX storage class (for example JuiceFS) and
  # a RollingUpdate strategy; the worker fences each run with a lock on the
  # shared volume.
  replicas: 1
  strategy:
    type: Recreate
  persistence:
    size: 20Gi
    storageClassName: ""
    accessModes: [ReadWriteOnce]
  # Regenerable per-run toolchain state. A run rebuilt on another pod starts
  # with cold caches while repositories and outputs remain on persistence.
  ephemeral:
    enabled: true
    mountPath: /tmp/agent-runtime-ephemeral
    sizeLimit: 20Gi
  nodeSelector: {}
  # Pin execution pods to nodes verified for Landlock, for example:
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #         - matchExpressions:
  #             - key: agent-runtime/landlock
  #               operator: In
  #               values: [abi3]
  affinity: {}
  # Sets AGENT_RUNTIME_EXECUTION_ISOLATION: landlock (fail closed), best_effort
  # (apply when available, otherwise log and continue) or none.
  isolation: landlock
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 20Gi

console:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/example/agent-runtime-console
    tag: latest
    pullPolicy: IfNotPresent
  appID: host_app
  runtimeBaseURL: ""
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: nginx
    host: agent-runtime.example.com
    tlsSecretName: agent-runtime-console-tls
    # The console is privileged. Set an existing ingress-controller basic-auth
    # secret or supply equivalent SSO annotations below.
    authSecretName: ""
    allowUnauthenticated: false
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  resources: {}

resources: {}

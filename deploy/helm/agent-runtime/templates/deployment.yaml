{{- $serviceToken := index .Values.secretEnv "AGENT_RUNTIME_SERVICE_TOKEN" -}}
{{- $allowAnonymous := eq (lower (toString (index .Values.env "AGENT_RUNTIME_ALLOW_ANONYMOUS"))) "true" -}}
{{- if and (not $serviceToken) (not $allowAnonymous) -}}
{{- fail "secretEnv.AGENT_RUNTIME_SERVICE_TOKEN is required unless env.AGENT_RUNTIME_ALLOW_ANONYMOUS=true is explicitly set for local development" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-runtime.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "agent-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent-runtime.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agent-runtime.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: agent-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AGENT_RUNTIME_WORKSPACE_STORAGE
              value: {{ .Values.codingWorker.workspaceStorage.mode | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := .Values.secretEnv }}
            {{- if $value }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-runtime.fullname" $ }}-secrets
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

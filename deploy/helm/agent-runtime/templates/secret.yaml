{{- $secrets := dict }}
{{- range $key, $value := .Values.secretEnv }}
{{- if $value }}
{{- $_ := set $secrets $key $value }}
{{- end }}
{{- end }}
{{- if $secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-runtime.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "agent-runtime.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $key, $value := $secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

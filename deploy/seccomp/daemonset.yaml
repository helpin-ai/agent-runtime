# Installs the Codex Landlock seccomp profile onto every node so the
# agent-runtime pods can reference it as a Localhost seccomp profile.
#
# Why: the container runtime's RuntimeDefault profile on these nodes predates
# the landlock_* syscalls, so Codex's Landlock sandbox is denied inside pods
# (and bubblewrap is blocked by the node's unprivileged-userns sysctl). The
# bundled profile is the upstream moby default (v27.5.1, 428 syscalls,
# SCMP_ACT_ERRNO default) which allowlists landlock_add_rule,
# landlock_create_ruleset, and landlock_restrict_self.
#
# Rollout order matters: this DaemonSet must be running (profile present on
# the node) BEFORE the api/worker deployments roll to the Localhost profile,
# or their pods fail to start with a missing-profile error.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seccomp-profile-installer
  labels:
    app: seccomp-profile-installer
spec:
  selector:
    matchLabels:
      app: seccomp-profile-installer
  template:
    metadata:
      labels:
        app: seccomp-profile-installer
    spec:
      tolerations:
        - operator: Exists
      initContainers:
        - name: install
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /host-seccomp/agent-runtime
              cp /profiles/codex-landlock-seccomp.json /host-seccomp/agent-runtime/codex-landlock-seccomp.json
              echo "seccomp profile installed"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: profiles
              mountPath: /profiles
              readOnly: true
            - name: host-seccomp
              mountPath: /host-seccomp
      containers:
        - name: pause
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do sleep 3600; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: profiles
          configMap:
            name: codex-seccomp-profile
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate

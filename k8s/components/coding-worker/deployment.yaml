apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime-coding-worker
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: coding-worker
spec:
  # Each replica serves up to four activities; the RWX workspace volume plus
  # the per-run flock let a retried activity land on any replica safely.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
      app.kubernetes.io/component: coding-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/component: coding-worker
    spec:
      # Must exceed AGENT_RUNTIME_WORKER_STOP_TIMEOUT (default 2m) so Temporal
      # activities can heartbeat/cancel cleanly during rolling restarts.
      terminationGracePeriodSeconds: 150
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      # Landlock ABI 3 (kernel >= 6.2) is required for the per-run filesystem
      # ruleset; nodes carry this label once verified.
      # The runtime image runs as the non-root node user; enforce it here so a
      # future base-image change cannot silently reintroduce root.
      securityContext:
        runAsNonRoot: true
        # node uid in the image; numeric so kubelet can verify runAsNonRoot.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: agent-runtime-execution-workspaces
        # Regenerable per-run toolchain state stays off the shared RWX volume.
        - name: ephemeral-state
          emptyDir:
            sizeLimit: 20Gi
      containers:
        - name: agent-runtime-coding-worker
          image: ghcr.io/helpin-ai/agent-runtime-coding:prod-latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - /agent-runtime-worker
            - --coding
          volumeMounts:
            - name: workspaces
              mountPath: /tmp/agent-runtime-workspaces
            - name: ephemeral-state
              mountPath: /tmp/agent-runtime-ephemeral
          envFrom:
            - secretRef:
                name: agent-runtime-secrets
          env:
            - name: AGENT_RUNTIME_STORE_DRIVER
              value: postgres
            - name: AGENT_RUNTIME_EXECUTION_ISOLATION
              value: landlock
            - name: AGENT_RUNTIME_EPHEMERAL_ROOT
              value: /tmp/agent-runtime-ephemeral
            # Covers private venv initialization on metadata-heavy RWX volumes.
            # Venv creation is pip-free and normally completes much sooner.
            - name: AGENT_RUNTIME_PYTHON_ENV_TIMEOUT
              value: 5m
            - name: AGENT_RUNTIME_MCP_ALLOWED_HOSTS
              value: "mcp.customer.io,mcp-eu.customer.io"
            - name: AGENT_RUNTIME_MCP_ALLOW_PRIVATE_NETWORKS
              value: "false"
            - name: AGENT_RUNTIME_MCP_ALLOW_HTTP
              value: "false"
            - name: AGENT_RUNTIME_BROWSER_CHROMIUM_ARGS
              value: "--no-sandbox,--disable-dev-shm-usage"
            - name: KERNEL_HEADLESS
              value: "true"
          ports:
            - name: health
              containerPort: 8091
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 20Gi

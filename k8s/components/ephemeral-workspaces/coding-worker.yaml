apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime-coding-worker
spec:
  template:
    spec:
      volumes:
        - name: workspaces
          persistentVolumeClaim: null
          emptyDir:
            sizeLimit: 20Gi
      containers:
        - name: agent-runtime-coding-worker
          # Older images reject this flag instead of silently using local
          # checkouts without session affinity/recovery.
          command: [/agent-runtime-worker, --coding, --ephemeral-workspaces]
          env:
            - name: AGENT_RUNTIME_WORKSPACE_STORAGE
              value: ephemeral
          resources:
            limits:
              ephemeral-storage: 44Gi

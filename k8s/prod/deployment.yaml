apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      containers:
        - name: agent-runtime
          image: ghcr.io/helpin-ai/agent-runtime:prod-latest
          imagePullPolicy: IfNotPresent
          envFrom:
            # All config (incl. DATABASE_URL) comes from the Doppler-synced
            # agent-runtime-secrets (store: doppler-agent-runtime-api).
            - secretRef:
                name: agent-runtime-secrets
          env:
            - name: AGENT_RUNTIME_ADDR
              value: ":8090"
            - name: AGENT_RUNTIME_STORE_DRIVER
              value: postgres
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      # The runtime image runs as the non-root node user; enforce it here so a
      # future base-image change cannot silently reintroduce root.
      securityContext:
        runAsNonRoot: true
        # node uid in the image; numeric so kubelet can verify runAsNonRoot.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: ghcr.io/helpin-ai/agent-runtime:prod-latest
          imagePullPolicy: IfNotPresent
          envFrom:
            # All config (incl. DATABASE_URL) comes from the Doppler-synced
            # agent-runtime-secrets (store: doppler-agent-runtime-api).
            - secretRef:
                name: agent-runtime-secrets
          env:
            - name: AGENT_RUNTIME_ADDR
              value: ":8090"
            - name: AGENT_RUNTIME_STORE_DRIVER
              value: postgres
            - name: AGENT_RUNTIME_MCP_ALLOWED_HOSTS
              value: "mcp.customer.io,mcp-eu.customer.io,ctrl-ys3gb9-mgmt-api.cstuinternal.com"
            - name: AGENT_RUNTIME_MCP_ALLOW_PRIVATE_NETWORKS
              value: "false"
            - name: AGENT_RUNTIME_MCP_ALLOW_HTTP
              value: "false"
            - name: AGENT_RUNTIME_BROWSER_CHROMIUM_ARGS
              value: "--no-sandbox,--disable-dev-shm-usage"
            - name: KERNEL_HEADLESS
              value: "true"
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime-worker
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: worker
spec:
  # Temporal workers are stateless pollers; scale up for throughput as needed.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/component: worker
    spec:
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      containers:
        - name: agent-runtime-worker
          image: ghcr.io/helpin-ai/agent-runtime:prod-latest
          imagePullPolicy: IfNotPresent
          command:
            - /agent-runtime-worker
          envFrom:
            - secretRef:
                name: agent-runtime-secrets
          env:
            - name: AGENT_RUNTIME_STORE_DRIVER
              value: postgres
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

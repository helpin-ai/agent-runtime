apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime-console
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: console
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/component: console
    spec:
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ghcr.io/helpin-ai/agent-runtime-console:prod-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: AGENT_RUNTIME_BASE_URL
              value: http://agent-runtime:8090
            - name: AGENT_RUNTIME_API_PREFIX
              value: /v1
            - name: AGENT_RUNTIME_APP_ID
              value: helpin
            - name: AGENT_RUNTIME_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-runtime-secrets
                  key: AGENT_RUNTIME_SERVICE_TOKEN
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

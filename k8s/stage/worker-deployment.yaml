apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime-worker
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/component: worker
    spec:
      # Must exceed AGENT_RUNTIME_WORKER_STOP_TIMEOUT (default 2m) so Temporal
      # activities can heartbeat/cancel cleanly during rolling restarts.
      terminationGracePeriodSeconds: 150
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      # The runtime image runs as the non-root node user; enforce it here so a
      # future base-image change cannot silently reintroduce root.
      securityContext:
        runAsNonRoot: true
        # node uid in the image; numeric so kubelet can verify runAsNonRoot.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          # Upstream moby default profile plus the landlock_* syscalls, so
          # Codex's Landlock sandbox works even though this runtime's
          # RuntimeDefault predates them. Installed on each node by the
          # seccomp-profile-installer DaemonSet in the infra repo (see
          # deploy/seccomp/README.md) - roll that out first.
          type: Localhost
          localhostProfile: agent-runtime/codex-landlock-seccomp.json
      containers:
        - name: agent-runtime-worker
          image: ghcr.io/helpin-ai/agent-runtime:stage-latest
          imagePullPolicy: IfNotPresent
          command:
            - /agent-runtime-worker
          envFrom:
            - secretRef:
                name: agent-runtime-secrets
          env:
            - name: AGENT_RUNTIME_STORE_DRIVER
              value: postgres
            # Codex sandboxes read-only and workspace-write runs with
            # bubblewrap, which needs an unprivileged user namespace that the
            # RuntimeDefault seccomp profile above denies. Landlock enforces the
            # same filesystem boundary without a namespace.
            - name: CODEX_USE_LEGACY_LANDLOCK
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

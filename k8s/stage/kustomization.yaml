apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-runtime

components:
- ../components/coding-worker

# The execution workspace claim is ReadWriteMany; the JuiceFS CSI driver's
# `juicefs-r2` StorageClass provides that here. The component leaves
# storageClassName unset and each overlay patches it in. Execution pods also
# require nodes labelled `agent-runtime/landlock=abi3` (see the component's
# nodeAffinity); label the pool before applying or the replicas stay Pending.
patches:
- target:
    kind: PersistentVolumeClaim
    name: agent-runtime-execution-workspaces
  patch: |-
    - op: add
      path: /spec/storageClassName
      value: juicefs-r2
# Execution capacity is one run per replica.
- target:
    kind: Deployment
    name: agent-runtime-coding-worker
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2

resources:
- namespace.yaml
- secrets.yaml
- deployment.yaml
- worker-deployment.yaml
- service.yaml
- console-deployment.yaml
- console-service.yaml
- console-ingress.yaml

images:
- name: ghcr.io/helpin-ai/agent-runtime
  newName: ghcr.io/helpin-ai/agent-runtime
  newTag: v0.11.1-rc.2
- name: ghcr.io/helpin-ai/agent-runtime-coding
  newName: ghcr.io/helpin-ai/agent-runtime-coding
  newTag: v0.11.1-rc.2
- name: ghcr.io/helpin-ai/agent-runtime-console
  newName: ghcr.io/helpin-ai/agent-runtime-console
  newTag: v0.11.1-rc.2

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-runtime

components:
- ../components/coding-worker

# The execution workspace claim is ReadWriteMany; the JuiceFS CSI driver's
# `juicefs-r2` StorageClass provides that here. The component leaves
# storageClassName unset and each overlay patches it in.
# Execution capacity is four activities per replica. Staging has no node pinned for
# Landlock, so isolation is best effort: confined where the node kernel allows
# it, unconfined with one warning elsewhere.
          # JuiceFS metadata is hosted in fsn1. Require the same region during
          # the writeback benchmark so create/open/stat latency is deterministic.
          # JuiceFS metadata is hosted in fsn1. Require the same region during
          # the writeback benchmark so create/open/stat latency is deterministic.
          # JuiceFS metadata is hosted in fsn1. Require the same region during
          # the writeback benchmark so create/open/stat latency is deterministic.
          # JuiceFS metadata is hosted in fsn1. Require the same region during
          # the writeback benchmark so create/open/stat latency is deterministic.
patches:
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: juicefs-r2
  target:
    kind: PersistentVolumeClaim
    name: agent-runtime-execution-workspaces
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agent-runtime-coding-worker
    spec:
      replicas: 2
      template:
        spec:
          # JuiceFS metadata is hosted in fsn1. Require the same region during
          # the writeback benchmark so create/open/stat latency is deterministic.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: topology.kubernetes.io/region
                        operator: In
                        values: [fsn1]
          containers:
            - name: agent-runtime-coding-worker
              env:
                - name: AGENT_RUNTIME_EXECUTION_ISOLATION
                  value: best_effort
                - name: AGENT_RUNTIME_REPOSITORY_CACHE_MODE
                  value: workspace

resources:
- namespace.yaml
- secrets.yaml
- deployment.yaml
- worker-deployment.yaml
- service.yaml
- console-deployment.yaml
- console-service.yaml
- console-ingress.yaml

images:
- name: ghcr.io/helpin-ai/agent-runtime
  newName: ghcr.io/helpin-ai/agent-runtime
  newTag: v0.12.1-rc.1
- name: ghcr.io/helpin-ai/agent-runtime-coding
  newName: ghcr.io/helpin-ai/agent-runtime-coding
  newTag: v0.12.1-rc.1
- name: ghcr.io/helpin-ai/agent-runtime-console
  newName: ghcr.io/helpin-ai/agent-runtime-console
  newTag: v0.12.1-rc.1

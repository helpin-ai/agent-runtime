apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-runtime

components:
- ../components/coding-worker
- ../components/node-local-repository-cache
- ../components/ephemeral-workspaces

# Keep the unused old claim rendered: do not prune retained run data during
# this migration. Drain active/paused runs before syncing matching API/workers.
# Four activities per replica, with strict Landlock on the verified FSN1 workers.
# Dependency caches use host-local disk; checkouts use per-pod disk emptyDir.
patches:
- patch: |-
    - op: add
      path: /spec/storageClassName
      value: juicefs-r2
  target:
    kind: PersistentVolumeClaim
    name: agent-runtime-execution-workspaces
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agent-runtime-coding-worker
    spec:
      replicas: 2
      template:
        spec:
          # Use the verified FSN1 local-NVMe workers for checkouts and caches.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: topology.kubernetes.io/region
                        operator: In
                        values: [fsn1]
                      # These non-control-plane NVMe workers were verified for Landlock.
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-staging-ax41-nvme-hetzner-fsn1-dc15-2090289
                          - k8s-staging-ax41-nvme-hetzner-fsn1-dc15-2090293
          containers:
            - name: agent-runtime-coding-worker
              env:
                - name: AGENT_RUNTIME_EXECUTION_ISOLATION
                  value: landlock
                - name: AGENT_RUNTIME_REPOSITORY_CACHE_MODE
                  value: repository

resources:
- namespace.yaml
- secrets.yaml
- deployment.yaml
- worker-deployment.yaml
- service.yaml
- console-deployment.yaml
- console-service.yaml
- console-ingress.yaml

images:
- name: ghcr.io/helpin-ai/agent-runtime
  newName: ghcr.io/helpin-ai/agent-runtime
  newTag: v0.12.2-rc.1
- name: ghcr.io/helpin-ai/agent-runtime-coding
  newName: ghcr.io/helpin-ai/agent-runtime-coding
  newTag: v0.12.2-rc.1
- name: ghcr.io/helpin-ai/agent-runtime-console
  newName: ghcr.io/helpin-ai/agent-runtime-console
  newTag: v0.12.2-rc.1

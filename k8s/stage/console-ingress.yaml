apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-runtime-console
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: https://oauth2-proxy.stage.usrmvn.com/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://oauth2-proxy.stage.usrmvn.com/oauth2/start?rd=$scheme://$host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User,X-Auth-Request-Email,Authorization
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: pp-nginx
  tls:
    - hosts:
        - agent-runtime.stage.usrmvn.com
      # No secretName: pp-nginx serves its configured *.stage.usrmvn.com
      # default certificate without copying a private key across namespaces.
  rules:
    - host: agent-runtime.stage.usrmvn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-runtime-console
                port:
                  number: 3000

openapi: 3.1.0
info:
  title: Helpin Agent Runtime API
  version: 0.3.0
  description: >
    HTTP API of the Helpin agent runtime: register agents, start and resume
    runs, stream run events, and manage run messages, artifacts, tools, and
    credentials. All requests require a service bearer token and an `app_id`
    that identifies the host application.
tags:
  - name: Runtime
    description: Runtime configuration and host-adapter health.
  - name: Agents
    description: Agent definitions scoped to a host application.
  - name: Runs
    description: Run lifecycle, event streams, messages, artifacts, tools, and credentials.
servers:
  - url: /v1
security:
  - serviceToken: []
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  schemas:
    TargetRef:
      type: object
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: string }
        display:
          type: object
          properties:
            title: { type: string }
            url: { type: string }
        metadata:
          type: object
          additionalProperties: true
    WorkspaceLease:
      type: object
      required: [id, root_path]
      properties:
        id: { type: string }
        provider: { type: string }
        root_path: { type: string }
        cleanup_policy: { type: string, enum: [always, on_terminal, manual] }
        metadata:
          type: object
          additionalProperties: true
    SkillRef:
      type: object
      properties:
        skill_id: { type: string }
        key: { type: string }
        version: { type: string }
        version_key: { type: string }
        config:
          type: object
          additionalProperties: true
    Agent:
      type: object
      required: [app_id, name]
      properties:
        id: { type: string }
        app_id: { type: string }
        name: { type: string }
        runtime_kind: { type: string, description: "Use native_sdk for writes. Historical records may contain codex or opencode." }
        provider: { type: string }
        model: { type: string }
        system_prompt: { type: string }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillRef' }
        allowed_tools:
          type: array
          items: { type: string }
        allowed_targets:
          type: array
          items: { type: string }
        approval_mode: { type: string, enum: [never, risk_based, mutating_tools, always] }
        default_invocation_mode: { type: string, enum: [autonomous, interactive] }
        execution_config:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StartRunRequest:
      type: object
      required: [app_id, agent_id, target]
      additionalProperties: false
      properties:
        model: { $ref: '#/components/schemas/RunModel' }
        model_credential: { $ref: '#/components/schemas/ModelCredential' }
        app_id: { type: string }
        host_run_id: { type: string }
        agent_id: { type: string }
        target: { $ref: '#/components/schemas/TargetRef' }
        instructions: { type: string }
        allowed_tools:
          type: array
          items: { type: string }
        external_actor_id: { type: string }
        mode: { type: string, enum: [autonomous, interactive] }
        execution_mode: { type: string, enum: [lightweight, durable] }
        trigger:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        turn_policy:
          $ref: '#/components/schemas/TurnPolicy'
        mcp_servers:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/RunMCPServer' }
    RunModel:
      type: object
      required: [provider, model]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [openai, anthropic, openrouter, openrouter_responses, openai_chatgpt] }
        model: { type: string, minLength: 1, maxLength: 256 }
    ModelCredential:
      type: object
      description: Request-only secret. Stored encrypted per run, never in run input, events, or checkpoints. No fallback on authentication failure. OAuth refresh tokens remain app-owned.
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [api_key, oauth] }
        api_key: { type: string, writeOnly: true }
        access_token: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
        connection_id: { type: string }
        account_id: { type: string }
    UpdateRunModelCredentialRequest:
      type: object
      required: [credential]
      additionalProperties: false
      properties:
        credential: { $ref: '#/components/schemas/ModelCredential' }
    RunModelCredentialUpdate:
      type: object
      properties:
        run_id: { type: string }
        expires_at: { type: string, format: date-time }
    ModelCredentialRefreshRequest:
      type: object
      description: Runtime posts to the app's configured trusted callback using service authentication. The app verifies the run owner, connection, provider, account, and active status before returning UpdateRunModelCredentialRequest.
      required: [app_id, run_id, connection_id, provider, reason]
      properties:
        app_id: { type: string }
        run_id: { type: string }
        host_run_id: { type: string }
        connection_id: { type: string }
        provider: { type: string }
        account_id: { type: string }
        credential_fingerprint: { type: string, description: SHA-256 of the rejected credential; lets the app return an already-rotated token without refreshing again. }
        reason: { type: string, enum: [expired, unauthorized] }
    RunMCPServer:
      type: object
      required: [server_id, server_name, transport, url, tools]
      additionalProperties: false
      properties:
        server_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'
        server_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        transport:
          type: string
          enum: [streamable_http]
        url:
          type: string
          format: uri
          pattern: '^https://'
        tools:
          type: array
          minItems: 1
          maxItems: 128
          items: { $ref: '#/components/schemas/RunMCPTool' }
        skills:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/SkillRef' }
        credential:
          $ref: '#/components/schemas/RunMCPCredential'
    RunMCPTool:
      type: object
      required: [name, access]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
        access:
          type: string
          enum: [read, write]
    RunMCPCredential:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [bearer_token, headers]
        access_token:
          type: string
          minLength: 1
          writeOnly: true
        headers:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            minLength: 1
          writeOnly: true
        expires_at:
          type: string
          format: date-time
      oneOf:
        - required: [access_token]
          properties:
            type: { const: bearer_token }
        - required: [headers]
          properties:
            type: { const: headers }
    UpdateRunMCPCredentialRequest:
      type: object
      required: [credential]
      additionalProperties: false
      properties:
        credential: { $ref: '#/components/schemas/RunMCPCredential' }
    RunMCPCredentialUpdate:
      type: object
      required: [run_id, server_id, updated_at]
      additionalProperties: false
      properties:
        run_id: { type: string }
        server_id: { type: string }
        expires_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentRun:
      type: object
      required: [id, app_id, agent_id, target, runtime_kind, execution_mode, invocation_mode, status]
      properties:
        id: { type: string }
        app_id: { type: string }
        host_run_id: { type: string }
        agent_id: { type: string }
        target: { $ref: '#/components/schemas/TargetRef' }
        runtime_kind: { type: string }
        execution_mode: { type: string }
        invocation_mode: { type: string }
        external_actor_id: { type: string }
        status: { type: string, enum: [queued, running, paused, completed, failed, cancelled] }
        pause_reason: { type: string }
        approval_state: { type: string }
        input:
          type: object
          properties:
            model: { $ref: '#/components/schemas/RunModel' }
            credential_source: { type: string, enum: [app] }
          additionalProperties: true
        output_summary:
          type: object
          additionalProperties: true
        workspace_lease:
          $ref: '#/components/schemas/WorkspaceLease'
        error_message: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      properties:
        id: { type: string }
        app_id: { type: string }
        run_id: { type: string }
        runtime_message_id: { type: string }
        role: { type: string }
        content: { type: string }
        message_type: { type: string }
        content_blocks: {}
        tool_invocations: {}
        sequence_no: { type: integer }
        created_at: { type: string, format: date-time }
    Artifact:
      type: object
      properties:
        id: { type: string }
        app_id: { type: string }
        run_id: { type: string }
        artifact_type: { type: string }
        format: { type: string }
        storage_mode: { type: string }
        inline_content: { type: string }
        metadata:
          type: object
          additionalProperties: true
        sequence_no: { type: integer }
        created_at: { type: string, format: date-time }
    Interaction:
      type: object
      properties:
        id: { type: string }
        app_id: { type: string }
        run_id: { type: string }
        runtime_kind: { type: string }
        interaction_kind: { type: string }
        status: { type: string }
        title: { type: string }
        summary: { type: string }
        request_payload:
          type: object
          additionalProperties: true
        response_payload:
          type: object
          additionalProperties: true
        resolved_by_external_id: { type: string }
        resolved_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ToolCall:
      type: object
      properties:
        id: { type: string }
        app_id: { type: string }
        run_id: { type: string }
        tool_name: { type: string }
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        error: { type: string }
        mutating: { type: boolean }
        approval_required: { type: boolean }
        created_at: { type: string, format: date-time }
    ToolDefinition:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        input_schema:
          type: object
          additionalProperties: true
        mutating: { type: boolean }
        supported_target_types:
          type: array
          items: { type: string }
    ToolCallRequest:
      type: object
      required: [tool_name]
      properties:
        tool_name: { type: string }
        input:
          type: object
          additionalProperties: true
    ToolContentItem:
      type: object
      properties:
        type: { type: string }
        text: { type: string }
    ToolResult:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ToolContentItem' }
        is_error: { type: boolean }
        approval_required: { type: boolean }
        interaction_id: { type: string }
    ResumeRunRequest:
      type: object
      required: [intent]
      properties:
        message_provenance:
          type: string
          enum: [human, system_notification]
          description: Authenticated host message origin. Human requires external_actor_id and cannot mark auth_completed. System notifications require reply intent, no interaction_id or response_payload, and no pending interaction. Omit for legacy inference.
        intent: { type: string, enum: [approve, request_changes, reply, auth_completed, continue], description: Continue resumes a manually paused run without answering pending interactions. }
        content: { type: string }
        resume_id:
          type: string
          description: Stable idempotency key for retrying the same resume request.
        interaction_id:
          type: string
          description: Optional pending interaction that this request resolves.
        response_payload:
          type: object
          additionalProperties: true
        external_actor_id: { type: string }
        turn_policy: { $ref: '#/components/schemas/TurnPolicy' }
    TurnPolicy:
      type: object
      additionalProperties: false
      properties:
        mode: { type: string, enum: [complete_on_finish, pause_after_assistant] }
        idle_timeout_seconds: { type: integer, minimum: 0 }
        expired_resume_strategy: { type: string }
        completion_mode: { type: string, enum: [implicit, explicit_finish] }
        max_completion_corrections: { type: integer, minimum: 0, maximum: 5 }
    AppComponent:
      type: object
      properties:
        name: { type: string }
        kind: { type: string }
        configured: { type: boolean }
        url: { type: string }
        transport: { type: string }
        auth_configured: { type: boolean }
        status: { type: string }
        http_status: { type: integer }
        error: { type: string }
    AppSummary:
      type: object
      properties:
        app_id: { type: string }
        components:
          type: array
          items: { $ref: '#/components/schemas/AppComponent' }
    RunEvent:
      type: object
      properties:
        event_id: { type: string }
        sent_at: { type: string, format: date-time }
        sequence_no: { type: integer, format: int64 }
        app_id: { type: string }
        run_id: { type: string }
        host_run_id: { type: string }
        type: { type: string }
        data: { type: object, additionalProperties: true }
    RunExecutionInfo:
      type: object
      properties:
        execution_mode: { type: string }
        state: { type: string }
        workflow_id: { type: string }
        temporal_run_id: { type: string }
        task_queue: { type: string }
        history_length: { type: integer, format: int64 }
        history_size_bytes: { type: integer, format: int64 }
        state_transition_count: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
    RunPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentRun' }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string }
    Capabilities:
      type: object
      description: Read-only, non-secret snapshot of how the runtime is configured.
      properties:
        runtime_kinds:
          type: array
          items: { type: string }
        providers:
          type: array
          items:
            type: object
            properties:
              auth_modes: { type: array, items: { type: string, enum: [api_key, oauth] } }
              run_credentials_configured: { type: boolean }
              name: { type: string }
              configured: { type: boolean }
              default_model: { type: string }
              base_url_overridden: { type: boolean }
        store:
          type: object
          properties:
            driver: { type: string }
            in_memory: { type: boolean }
        durable:
          type: object
          properties:
            enabled: { type: boolean }
            temporal_address: { type: string }
            namespace: { type: string }
        skills:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              title: { type: string }
              description: { type: string }
        apps:
          type: array
          items: { $ref: '#/components/schemas/AppSummary' }
        run_mcp:
          type: object
          required: [supported, transports, credential_encryption_configured]
          additionalProperties: false
          properties:
            supported: { type: boolean }
            transports:
              type: array
              items: { type: string, enum: [streamable_http] }
            credential_encryption_configured: { type: boolean }
        service_auth_enabled: { type: boolean }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ToolDefinition' }
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [Runtime]
      summary: Runtime configuration snapshot
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
  /app-health:
    get:
      operationId: getAppHealth
      tags: [Runtime]
      parameters:
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sanitized host-adapter connectivity status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSummary' }
  /agents:
    get:
      operationId: listAgents
      tags: [Agents]
      parameters:
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
    post:
      operationId: createAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Agent' }
      responses:
        '201':
          description: Created agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
  /agents/{agent_id}:
    get:
      operationId: getAgent
      tags: [Agents]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
    put:
      operationId: updateAgent
      tags: [Agents]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Agent' }
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '201':
          description: Created agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
  /runs:
    get:
      operationId: listRuns
      tags: [Runs]
      parameters:
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentRun' }
    post:
      operationId: startRun
      tags: [Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
      responses:
        '202':
          description: Started run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
  /runs/search:
    get:
      operationId: searchRuns
      tags: [Runs]
      parameters:
        - name: app_id
          in: query
          required: true
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Filtered run page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
  /runs/{run_id}:
    get:
      operationId: getRun
      tags: [Runs]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
  /runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      tags: [Runs]
      summary: Stream run events (Server-Sent Events)
      description: >
        Streams a run's events as `text/event-stream`. Each SSE `event:` is the
        event type (run lifecycle: run.queued/started/paused/resumed/completed/
        failed/cancelled, plus adapter events: assistant_message_started/delta/
        completed, tool_call_started/args_delta/finished/result, plan_updated).
        The `data:` is a JSON `{app_id, run_id, host_run_id, type, data}`
        object. `usage.checkpoint` and terminal events can include cumulative
        usage data when token usage is available. Comment lines (`: ping`) are
        sent periodically as heartbeats.
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /runs/{run_id}/events/history:
    get:
      operationId: listRunEventHistory
      tags: [Runs]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Persisted event history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RunEvent' }
  /runs/{run_id}/execution:
    get:
      operationId: getRunExecution
      tags: [Runs]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Runtime and Temporal execution details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunExecutionInfo' }
  /runs/{run_id}/messages:
    get:
      operationId: listRunMessages
      tags: [Runs]
      parameters: &runParams
        - name: run_id
          in: path
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
    post:
      operationId: appendRunMessage
      tags: [Runs]
      parameters: *runParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string }
                content: { type: string }
      responses:
        '201':
          description: Created message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
  /runs/{run_id}/artifacts:
    get:
      operationId: listRunArtifacts
      tags: [Runs]
      parameters: *runParams
      responses:
        '200':
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artifact' }
    post:
      operationId: appendRunArtifact
      tags: [Runs]
      parameters: *runParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact_type, inline_content]
              properties:
                artifact_type: { type: string }
                format: { type: string }
                storage_mode: { type: string }
                inline_content: { type: string }
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Created artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
  /runs/{run_id}/interactions:
    get:
      operationId: listRunInteractions
      tags: [Runs]
      parameters: *runParams
      responses:
        '200':
          description: Interactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Interaction' }
  /runs/{run_id}/tool-calls:
    get:
      operationId: listRunToolCalls
      tags: [Runs]
      parameters: *runParams
      responses:
        '200':
          description: Durable tool-call audit records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ToolCall' }
  /runs/{run_id}/tools:
    get:
      operationId: listRunTools
      tags: [Runs]
      parameters: *runParams
      responses:
        '200':
          description: Tools available to this run
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items: { $ref: '#/components/schemas/ToolDefinition' }
    post:
      operationId: callRunTool
      tags: [Runs]
      parameters: *runParams
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolCallRequest' }
      responses:
        '200':
          description: Tool call result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolResult' }
  /runs/{run_id}/resume:
    post:
      operationId: resumeRun
      tags: [Runs]
      parameters: *runParams
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeRunRequest' }
      responses:
        '200':
          description: Resumed run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
  /runs/{run_id}/pause:
    post:
      operationId: pauseRun
      tags: [Runs]
      description: Requests a durable run to pause. The run becomes paused after its active activity stops.
      parameters: *runParams
      responses:
        '200':
          description: Pause requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
  /runs/{run_id}/mcp-servers/{server_id}/credential:
    put:
      operationId: updateRunMcpCredential
      tags: [Runs]
      summary: Replace one active run MCP credential without changing its server or tool policy
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
        - name: server_id
          in: path
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRunMCPCredentialRequest' }
      responses:
        '200':
          description: Non-secret credential rotation acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunMCPCredentialUpdate' }
  /runs/{run_id}/approve:
    post:
      operationId: approveRun
      tags: [Runs]
      parameters: *runParams
      responses:
        '200':
          description: Approved run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
  /runs/{run_id}/request-changes:
    post:
      operationId: requestRunChanges
      tags: [Runs]
      parameters: *runParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
      responses:
        '200':
          description: Run updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
  /runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      tags: [Runs]
      description: Cancels a run by its runtime-owned run ID or application-owned host_run_id.
      parameters: *runParams
      responses:
        '200':
          description: Cancelled run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }

  /runs/{run_id}/model-credential:
    parameters:
      - { name: run_id, in: path, required: true, schema: { type: string } }
      - { name: app_id, in: query, required: true, schema: { type: string } }
    put:
      operationId: updateRunModelCredential
      tags: [Runs]
      summary: Replace an active run credential without changing its connection or account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRunModelCredentialRequest' }
      responses:
        '200':
          description: Updated credential metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunModelCredentialUpdate' }
        '400': { description: 'Invalid credential, identity mismatch, or terminal run' }
    delete:
      operationId: deleteRunModelCredential
      tags: [Runs]
      summary: Revoke the credential for subsequent model requests
      responses:
        '204': { description: Credential revoked }
